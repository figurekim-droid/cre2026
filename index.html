<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#1B4332"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>공인중개사 2026 합격앱</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --g:#1B4332;--g2:#2D6A4F;--g3:#40916C;
  --gl:#D8F3DC;--gll:#B7E4C7;
  --bg:#F0F2F5;--card:#fff;--bdr:#E4E7EB;
  --tx:#111827;--tx2:#4B5563;--tx3:#9CA3AF;
  --red:#B71C1C;--rl:#FFEBEE;
  --amber:#E65100;
  --r:14px;--nav:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;}
button:active{opacity:.75;transform:scale(.97);}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:600;height:var(--nav);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 1px 10px rgba(0,0,0,.07);}
#nav-home{font-weight:900;font-size:18px;color:var(--g);display:flex;align-items:center;gap:6px;}
#nav-wrong{padding:6px 12px;border-radius:9px;font-size:18px;font-weight:700;background:#F3F4F6;color:var(--tx3);transition:all .2s;}
#nav-wrong.on{background:var(--rl);color:var(--red);}

/* VIEWS */
.view{display:none;padding-top:var(--nav);min-height:100vh;animation:fadeUp .22s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.wrap{max-width:700px;margin:0 auto;padding:14px 14px 96px;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--g) 0%,var(--g2) 50%,var(--g3) 100%);border-radius:20px;padding:22px 20px 18px;color:#fff;margin-bottom:14px;box-shadow:0 6px 24px rgba(27,67,50,.3);}
.hero-lbl{font-size:16px;letter-spacing:3px;opacity:.6;margin-bottom:3px;}
.hero h1{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.3;margin-bottom:14px;}
.hero-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.hero-dday{margin-left:auto;text-align:right;}
.hero-dday-lbl{font-size:16px;opacity:.65;}
.hero-dday-num{font-size:29px;font-weight:900;color:#B7E4C7;line-height:1;}
.hero-dday-num.urgent{color:#FFCDD2;}
.hero-foot{font-size:16px;opacity:.6;background:rgba(255,255,255,.12);border-radius:7px;padding:6px 10px;line-height:1.6;}

/* WRONG BANNER */
.wbanner{display:none;align-items:center;gap:10px;background:var(--rl);border:1.5px solid #FFCDD2;border-radius:var(--r);padding:11px 14px;margin-bottom:12px;cursor:pointer;}
.wbanner.show{display:flex;}

/* SUBJECT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.scard{background:var(--card);border-radius:var(--r);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:9px;border:1.5px solid var(--bdr);box-shadow:0 1px 6px rgba(0,0,0,.04);transition:transform .18s;}
.scard:active{transform:scale(.97);}
.scard-top{display:flex;justify-content:space-between;align-items:flex-start;}
.scard-name{font-weight:800;font-size:16px;line-height:1.3;}
.scard-meta{font-size:22px;color:var(--tx3);margin-top:1px;}

/* LESSON LIST */
.lcard{background:var(--card);border:1.5px solid var(--bdr);border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:11px;margin-bottom:9px;text-align:left;width:100%;transition:transform .18s;}
.lcard:active{transform:scale(.98);}
.lnum{width:42px;height:42px;border-radius:10px;background:#F9FAFB;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#D1D5DB;flex-shrink:0;}
.linfo{flex:1;min-width:0;}
.ltitle{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lmeta{font-size:22px;color:var(--tx3);margin-top:2px;}
.lmeta.ok{color:#2E7D32;}.lmeta.warn{color:#E65100;}.lmeta.bad{color:#C62828;}

/* LESSON HEADER */
.les-hdr{border-radius:18px;padding:13px;color:#fff;margin-bottom:13px;display:flex;align-items:center;gap:11px;}
.les-title{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.les-meta{font-size:22px;opacity:.7;margin-top:2px;}
.back-btn{background:rgba(255,255,255,.2);border-radius:9px;color:#fff;padding:7px 11px;font-size:22px;flex-shrink:0;}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:13px;}
.tab{flex:1;padding:9px 3px;border-radius:10px;font-weight:700;font-size:22px;background:#EFEFEF;color:#666;transition:all .18s;line-height:1.3;}
.tab.on{color:#fff;}

/* ═══ STUDY SECTIONS ═══ */
.study-section{margin-bottom:11px;border-radius:var(--r);overflow:hidden;border:1.5px solid;}
.ss-hdr{padding:11px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
.ss-ico{font-size:22px;flex-shrink:0;}
.ss-ttl{font-weight:800;font-size:16px;flex:1;}
.ss-cnt{font-size:16px;font-weight:500;opacity:.6;margin-left:4px;}
.ss-arr{font-size:22px;opacity:.5;transition:transform .2s;flex-shrink:0;}
.ss-arr.open{transform:rotate(180deg);}
.ss-body{display:none;padding:0 14px 13px;}
.ss-body.open{display:block;}

/* 기본학습 */
.ss-learn{background:#ECFDF5;border-color:#6EE7B7;}
.ss-learn .ss-hdr{background:#D1FAE5;}
.ss-learn .ss-ttl{color:#065F46;}
/* 암기 */
.ss-mem{background:#FFFBEB;border-color:#FCD34D;}
.ss-mem .ss-hdr{background:#FEF3C7;}
.ss-mem .ss-ttl{color:#92400E;}
/* 주의 */
.ss-warn{background:#FFF7ED;border-color:#FDBA74;}
.ss-warn .ss-hdr{background:#FFEDD5;}
.ss-warn .ss-ttl{color:#9A3412;}
/* 출제포인트 */
.ss-exam{background:#EFF6FF;border-color:#93C5FD;}
.ss-exam .ss-hdr{background:#DBEAFE;}
.ss-exam .ss-ttl{color:#1E40AF;}

/* 학습 항목 */
.si{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start;}
.si:last-child{margin-bottom:0;}
.si-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.si-txt{font-size:16px;line-height:1.72;color:var(--tx);}
.si-txt .hl{color:#C62828;font-weight:800;}
.si-txt .kw{color:#1565C0;font-weight:700;}

/* 암기 표 */
.mem-tbl{width:100%;border-collapse:collapse;font-size:18px;margin-top:2px;}
.mem-tbl th{background:rgba(0,0,0,.07);padding:7px 9px;text-align:left;font-weight:800;border-bottom:1px solid rgba(0,0,0,.08);font-size:22px;}
.mem-tbl td{padding:7px 9px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:top;line-height:1.65;}
.mem-tbl tr:last-child td{border-bottom:none;}
.mem-key{font-weight:800;white-space:nowrap;color:var(--tx);}
.mem-val .hl{color:#C62828;font-weight:800;}

/* 주의 박스 */
.wb{background:rgba(255,255,255,.75);border-radius:9px;padding:10px 12px;margin-bottom:8px;border-left:4px solid #FB8C00;}
.wb:last-child{margin-bottom:0;}
.wb-ttl{font-weight:800;font-size:18px;color:#C05621;margin-bottom:4px;}
.wb-body{font-size:16px;line-height:1.7;color:var(--tx2);}
.wb-body .hl{color:#C62828;font-weight:800;}

/* 출제포인트 */
.ep{display:flex;gap:9px;margin-bottom:8px;align-items:flex-start;}
.ep:last-child{margin-bottom:0;}
.ep-num{width:21px;height:21px;border-radius:5px;background:#1565C0;color:#fff;font-size:16
